name: Daily Pages rebuild

# Rebuilds the GitHub Pages site once a day so that future-dated posts
# (filename YYYY-MM-DD-slug.md) appear automatically on or after their date,
# without requiring a manual push. Jekyll's default `future: false` excludes
# such posts at build time; this workflow re-triggers a build daily.

on:
  schedule:
    # 06:00 UTC = 09:00 МСК. GitHub may delay scheduled runs by up to ~1 hour
    # under load — fine for a blog.
    - cron: '0 6 * * *'
  workflow_dispatch:  # allow manual trigger from Actions tab

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Trigger GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
